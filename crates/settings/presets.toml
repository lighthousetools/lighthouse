[[connectors]]
id = "linear"
label = "Linear"
url = "https://mcp.linear.app/mcp"
auth = "oauth"
read_tools = ["list_issues", "get_issue", "list_cycles", "list_projects", "list_comments"]

[[connectors]]
id = "github"
label = "GitHub"
url = "https://api.githubcopilot.com/mcp/"
auth = "oauth"
read_tools = [
  "list_pull_requests", "list_releases", "search_issues", "search_pull_requests",
  "get_pull_request_status", "get_pull_request_files",
]

[[sources]]
id = "github"
label = "GitHub"
definition = { connector = "github", preset = "github" }

[[sources]]
id = "linear"
label = "Linear"
definition = { connector = "linear", preset = "linear" }

[[sources]]
id = "superhuman-mail"
label = "Superhuman Mail"
definition = { connector = "superhuman-mail", preset = "superhuman-mail" }

[[sources]]
id = "microsoft-calendar"
label = "Microsoft 365 Calendar"
definition = { connector = "microsoft-calendar", preset = "microsoft-calendar" }

[[sources]]
id = "pipedrive"
label = "Pipedrive"
definition = { connector = "pipedrive", preset = "pipedrive" }

# A mailbox: replace the tool and the paths with what your mail server returns.
[[sources]]
id = "mail"
label = "Mail"

[sources.definition]
connector = "mail"
domain = "mail"
service = "mail"

[sources.definition.collections.inbox]
tool = "list_threads"
items = "threads"
kind = "thread"

[sources.definition.collections.inbox.fields]
external_id = "id"
title = "subject"
author = "from"
summary = "snippet"
occurred_at = "date"
url = "url"
labels = "labels"
important = { path = "labels", contains = "IMPORTANT" }
unread = { path = "labels", contains = "UNREAD" }

# A calendar: replace the tool and the paths with what your server returns.
[[sources]]
id = "calendar"
label = "Calendar"

[sources.definition]
connector = "calendar"
domain = "calendar"
service = "calendar"

[sources.definition.collections.events]
tool = "list_events"
items = "events"
kind = "event"

[sources.definition.collections.events.fields]
external_id = "id"
title = "title"
starts_at = "start"
ends_at = "end"
url = "url"
