# Suggestions the apps offer when a tenant or a person adds a provider or a
# connector. They are data, not logic: the server only passes them on, and
# everything stays editable after it is added.
#
# Prices are EUR per million tokens at standard rates, rounded to cents.
# Checked on 2026-11-09 against the providers' pricing pages:
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://developers.openai.com/api/docs/pricing
# USD to EUR at the ECB reference rate of 2026-11-06: 1 EUR = 1.1165 USD.
# List prices in USD are in the comments. Haiku's price is for prompts up to
# 100,000 tokens; longer ones cost five times as much.

