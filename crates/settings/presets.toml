# Suggestions the apps offer when a tenant or a person adds a provider or a
# connector. They are data, not logic: the server only passes them on, and
# everything stays editable after it is added. Prices are list prices in EUR per
# million tokens, rounded from the providers' USD prices. Check them against the
# provider's pricing page before relying on cost reports.

[[providers]]
id = "anthropic"
label = "Anthropic"
kind = "anthropic"
key_url = "https://console.anthropic.com/settings/keys"

[[providers.models]]
task = "text"
model = "claude-opus-5-5"
label = "Claude Opus 5.5"
input_eur_per_mtok = 3.7
output_eur_per_mtok = 18.5

