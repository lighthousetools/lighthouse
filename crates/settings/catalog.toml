# Remote MCP servers run by their vendors. Each URL was checked against the live server on 2026-11-09:
# it answers an MCP `initialize`, or asks for sign-in with a 401. They are suggestions for the apps,
# not trusted code: what a connector may do still follows its read and draft lists and approvals.
#
# registration = "dynamic": one click, the server registers Lighthouse itself.
# registration = "preregistered": create an OAuth app at the vendor first, then set client_id and the secret.
# A URL with {braces} needs your account's part, such as a subdomain.

