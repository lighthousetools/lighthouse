[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # Unmaintained, with no known vulnerability. Pulled in by pdf-extract, which
    # only reads files the signed-in owner uploads.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only, reached through owner uploads" },
]
