# Configuration of the local demo. Everything here is fictional: the companies
# Acme Ltd and Globex Inc, the people and every amount come from the demo MCP
# server, and the "demo" provider answers without a model. Do not use this file
# for a real instance.

[server]
bind = "0.0.0.0:8080"
public_url = "http://localhost:8088"
timezone = "Europe/Berlin"

[database]
url = "postgres://lighthouse:lighthouse-demo@demo-postgres:5432/lighthouse"

# The compose file sets a fixed demo key through LIGHTHOUSE_VAULT__MASTER_KEY.
[vault]

[owner]
name = "Alex Example"
email = "alex@example.com"

[owner.accounts]
demo = "alex-example"

[paths]
agents = "/usr/share/lighthouse/demo/agents"
automations = "/usr/share/lighthouse/demo/automations"
skills = "/usr/share/lighthouse/skills"
created_agents = "/var/lib/lighthouse/data/agents"
created_automations = "/var/lib/lighthouse/data/automations"
web = "/srv/lighthouse-web/dist"

[providers.demo]
kind = "demo"

[providers.demo.tasks.text]
model = "demo"
input_eur_per_mtok = 0.5
output_eur_per_mtok = 1.5

[routing.text]
provider = "demo"

[connectors.demo]
transport = "stdio"
command = "lighthouse-demo-mcp"
read_tools = [
  "list_issues", "list_threads", "list_events", "list_tickets", "search_pull_requests",
  "get_pull_request_status", "get_pull_request_files", "list_deals", "list_accounts",
  "list_transactions", "list_invoices", "list_contracts", "list_rooms", "list_room_steps",
  "list_room_milestones", "list_holdings", "list_quotes",
]
draft_tools = ["create_draft"]

[talk]
agent = "assistant"

# The demo asks Open-Meteo for the weather in Berlin; without a network the brief has none.
[weather]
latitude = 52.52
longitude = 13.41
location = "Berlin"

[publishing]
connector = "demo"
tool = "create_post"
service = "linkedin"
input = { text = "{{post.body}}", first_comment = "{{post.first_comment}}" }

[brain]
path = "/var/lib/lighthouse/data/brain"

[sources.mail]
connector = "demo"
domain = "mail"
service = "mail"
account = "alex@example.com"
[sources.mail.collections.inbox]
tool = "list_threads"
items = "threads"
kind = "thread"
[sources.mail.collections.inbox.fields]
external_id = "id"
title = "subject"
author = "from"
summary = "snippet"
occurred_at = "date"
url = "url"
labels = "labels"
important = { path = "labels", contains = "IMPORTANT" }
unread = { path = "labels", contains = "UNREAD" }
[sources.mail.actions.draft]
tool = "create_draft"
kind = "thread"
input = { thread_id = "{{item.external_id}}", body = "{{input.body}}" }
[sources.mail.actions.reply]
tool = "send_reply"
kind = "thread"
input = { thread_id = "{{item.external_id}}", body = "{{input.body}}" }

[sources.calendar]
connector = "demo"
domain = "calendar"
service = "calendar"
[sources.calendar.collections.events]
tool = "list_events"
kind = "event"
[sources.calendar.collections.events.fields]
external_id = "id"
title = "summary"
starts_at = "start"
ends_at = "end"
state = "status"
attendees = "attendees"
url = "url"
[sources.calendar.actions.move]
tool = "move_event"
kind = "event"
input = { event_id = "{{item.external_id}}", start = "{{input.start}}", end = "{{input.end}}" }
[sources.calendar.actions.create]
tool = "create_event"
input = { title = "{{input.title}}", start = "{{input.start}}", end = "{{input.end}}" }

[sources.issues]
connector = "demo"
domain = "issues"
service = "linear"
[sources.issues.collections.assigned]
tool = "list_tickets"
kind = "issue"
flags = ["assigned"]
[sources.issues.collections.assigned.fields]
external_id = "id"
key = "identifier"
title = "title"
state = "status"
assignee = "assignee"
project = "project"
url = "url"
occurred_at = "updatedAt"

[sources.issues.actions.comment]
tool = "add_comment"
kind = "issue"
input = { issue_id = "{{item.external_id}}", body = "{{input.body}}" }

[sources.code]
connector = "demo"
preset = "github"
account = "alex-example"
interval = "30m"

[sources.crm-acme]
connector = "demo"
domain = "deals"
[sources.crm-acme.collections.deals]
tool = "list_deals"
input = { company = "acme" }
kind = "deal"
[sources.crm-acme.collections.deals.fields]
external_id = "id"
title = "title"
state = "stage"
amount = "value"
currency = "currency"
probability = "probability"
assignee = "owner"
last_activity_at = "last_activity"
url = "url"
occurred_at = "updated"
pipeline = "pipeline"
next_step = "next_step"
contact = "contact"
ends_at = "close"
[sources.crm-acme.actions.move]
tool = "move_deal"
kind = "deal"
input = { id = "{{item.external_id}}", stage = "{{input.stage}}" }

