name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      web_ref:
        description: "lighthouse-web ref to build (empty: the tag of the same name if it exists, else main)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lighthousetools/lighthouse-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the lighthouse-web ref
        id: web
        env:
          INPUT_REF: ${{ inputs.web_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref=main
            if [ "$REF_TYPE" = tag ] \
              && git ls-remote --exit-code --tags https://github.com/lighthousetools/lighthouse-web.git "refs/tags/$REF_NAME" >/dev/null; then
              ref="$REF_NAME"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lighthousetools/lighthouse-web
          ref: ${{ steps.web.outputs.ref }}
          path: web-src
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web-src/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-src/pnpm-lock.yaml

      - name: Build the web app
        working-directory: web-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage the web app for the image
        run: |
          echo "web_sha=$(git -C web-src rev-parse HEAD)" >> "$GITHUB_ENV"
          cp -r web-src/dist web-dist

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=lighthouse-server
            org.opencontainers.image.description=Lighthouse server, lht and the web app

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Write the summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          WEB_REF: ${{ steps.web.outputs.ref }}
        run: |
          {
            echo "## Release image"
            echo
            echo "- Image: \`$IMAGE@$DIGEST\`"
            echo "- Web app: lighthouse-web \`$WEB_REF\` (\`$web_sha\`)"
            echo "- Tags:"
            echo "$TAGS" | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
