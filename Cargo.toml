[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lighthousetools/lighthouse"
publish = false

[workspace.dependencies]
lighthouse-api = { path = "crates/api" }
lighthouse-audit = { path = "crates/audit" }
lighthouse-auth = { path = "crates/auth" }
lighthouse-brain = { path = "crates/brain" }
lighthouse-config = { path = "crates/config" }
lighthouse-core = { path = "crates/core" }
lighthouse-mcp = { path = "crates/mcp" }
lighthouse-notify = { path = "crates/notify" }
lighthouse-router = { path = "crates/router" }
lighthouse-runtime = { path = "crates/runtime" }
lighthouse-scheduler = { path = "crates/scheduler" }
lighthouse-skills = { path = "crates/skills" }
lighthouse-store = { path = "crates/store" }
lighthouse-vault = { path = "crates/vault" }

aes-gcm = "0.11"
anyhow = "1"
argon2 = { version = "0.6", features = ["password-hash"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
croner = "4"
figment = { version = "0.10", features = ["toml", "env"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs"] }
pdf-extract = "0.12"
pulldown-cmark = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rmcp = { version = "3", features = ["client", "server", "macros", "auth", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rpassword = "7"
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
tantivy = "0.27"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
