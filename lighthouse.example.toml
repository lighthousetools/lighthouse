# Example configuration. Copy to lighthouse.toml and adjust.
# Any value can be overridden with LIGHTHOUSE_<SECTION>__<KEY>.

[server]
bind = "0.0.0.0:8080"
public_url = "https://lighthouse.example.com"
timezone = "Europe/Berlin"
# Set the admin token with LIGHTHOUSE_SERVER__ADMIN_TOKEN.

[database]
url = "postgres://lighthouse:lighthouse@localhost:5432/lighthouse"

[vault]
# Create the file with `lht keys init`.
master_key_file = "/var/lib/lighthouse/data/master.key"

[owner]
name = "Alex Example"
email = "alex@example.com"

[owner.accounts]
linear = "alex"
github = "alex-example"

[paths]
agents = "agents"
skills = "skills"
automations = "automations"

[providers.anthropic]
kind = "anthropic"

[providers.anthropic.tasks.text]
model = "set-a-model-name"
input_eur_per_mtok = 3.0
output_eur_per_mtok = 15.0

[providers.openai]
kind = "openai"

[providers.openai.tasks.text]
model = "set-a-model-name"
input_eur_per_mtok = 2.0
output_eur_per_mtok = 8.0

[routing.text]
provider = "anthropic"
fallback = "openai"

# Every tool on neither read_tools nor draft_tools counts as `write` and needs an approval.
[connectors.linear]
transport = "http"
url = "https://mcp.linear.app/mcp"
auth = "oauth"
read_tools = ["list_issues", "get_issue", "list_cycles", "list_projects", "list_comments"]

[connectors.github]
transport = "http"
url = "https://api.githubcopilot.com/mcp/"
auth = "oauth"
read_tools = [
  "list_pull_requests", "list_releases", "search_issues", "search_pull_requests",
  "get_pull_request_status", "get_pull_request_files",
]

# An OAuth app registered once for the instance. Connectors that reach `url` without a client of their own sign in with
# it. The secret comes from LIGHTHOUSE_OAUTH_APPS__GITHUB__CLIENT_SECRET.
# [oauth_apps.github]
# url = "https://api.githubcopilot.com/mcp/"
# client_id = "your-github-app-client-id"

[connectors.grafana]
transport = "stdio"
command = "mcp-grafana"
read_tools = ["list_alert_rules", "query_prometheus"]

[connectors.grafana.secret_env]
GRAFANA_API_KEY = "mcp:grafana"

[delivery]
slack_channels = ["#weekly"]

[delivery.smtp]
host = "smtp.example.com"
port = 587
username = "lighthouse"
from = "lighthouse@example.com"

# Connected data: tools that fill the caches of mail, calendar, issues and pull
# requests. See docs/connected.md for the format and for mail and calendar examples.
[sources.github]
connector = "github"
preset = "github"
interval = "10m"

[sources.linear]
connector = "linear"
preset = "linear"

# Pushes through the delivery channels. The apps always get live events.
[notifications]
deliver = ["owner"]
decisions = true      # a run waits for your decision
done = false          # a run finished
alerts = "critical"   # lowest severity of new alerts to push

# Second Brain, see docs/brain.md. Without a provider, search is lexical and
# images and audio are refused.
[brain]
path = "brain"
# provider = "openai"
# embedding_model = ""
# vision_model = ""
# transcription_model = ""

# Users and tenants, see docs/architecture.md. The defaults keep a single-user
# install as it was: the owner above signs in and nobody can sign up.
# [tenancy]
# signup = "closed"            # closed, invite or open
# allow_instance_keys = true   # tenants without own provider keys use the instance keys
# data_dir = "tenants"         # Brain and created files of further tenants
# require_verified_email = false  # people who sign up confirm their address before they sign in
# allow_private_endpoints = false  # providers and connectors added in the apps may use private addresses
#
# [tenancy.limits]             # what a tenant and each member may add in the apps
# providers = 10
# models = 20
# connectors = 25
# tenant_entries = 2000
